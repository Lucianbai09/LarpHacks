{% extends "base.html" %}

{% block title %}{{ "Confirm your account" if registering else "Log in" }} · LarpHacks{% endblock %}

{% block content %}
  <h1>{{ "Confirm your account" if registering else "Log in" }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button>{{ "Confirm and start larping" if registering else "Log me in" }}</button>
  </form>
{% endblock %}
