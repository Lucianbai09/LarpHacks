{% extends "base.html" %}

{% block title %}Log in · LarpHacks{% endblock %}

{% block content %}
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Username or email
      <input name="identifier" value="{{ identifier }}" autocomplete="username" required autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button>Log in</button>
  </form>
  <p><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
  <p>New here? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
