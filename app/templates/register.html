{% extends "base.html" %}

{% block title %}Register · LarpHacks{% endblock %}

{% block content %}
  <h1>Register</h1>
  <p>Your username is public, so it doesn't have to be your real name. Your email stays private.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Username
      <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </label>
    <label>
      Email
      <input type="email" name="email" value="{{ email }}" autocomplete="email" required>
    </label>
    <label>
      <input type="checkbox" name="terms" {% if request.form.get("terms") %}checked{% endif %} required>
      I'm at least 13, and I agree to the
      <a href="{{ url_for('main.terms') }}" target="_blank">Terms</a> and
      <a href="{{ url_for('main.privacy') }}" target="_blank">Privacy Policy</a>,
      including LarpHacks storing what I share about my habits.
    </label>
    <button>Email me a confirmation link</button>
  </form>
  <p>Already in character? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
