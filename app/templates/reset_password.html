{% extends "base.html" %}

{% block title %}Choose a new password · LarpHacks{% endblock %}

{% block content %}
  <h1>Choose a new password</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      New password
      <input type="password" name="password" minlength="{{ min_password_length }}" autocomplete="new-password" required autofocus>
    </label>
    <button>Save and log in</button>
  </form>
{% endblock %}
