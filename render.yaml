services:
  - type: web
    name: larphacks
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free instances have no shell, so the database is set up on every start. Both commands are safe to re-run.
    startCommand: flask init-db && flask seed-demo && gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: larphacks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: larphacks-db
    plan: free
