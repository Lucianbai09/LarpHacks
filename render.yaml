services:
  - type: web
    name: larphacks
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free instances have no shell, so the database is set up on every start, including waking from sleep. Demo data
    # is re-seeded each time, because its days are relative to when it was seeded. This also drops real comments on
    # demo posts. It's one command because each one restarts Python, which is slow on a free instance. The longer
    # timeout is for the same reason: gunicorn's default of 30 seconds could kill a worker that's still loading.
    startCommand: flask reset-demo && gunicorn run:app --timeout 120
    envVars:
      # "Today" for check-ins and day counts. Render's clock is UTC, which rolls over mid-evening in North America.
      - key: TZ
        value: America/Toronto
      - key: DATABASE_URL
        fromDatabase:
          name: larphacks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Render asks for these when the Blueprint is first applied. The README explains how to get them.
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: larphacks-db
    plan: free
