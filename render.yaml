services:
  - type: web
    name: larphacks
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free instances have no shell, so the database is set up on every start. Demo data is re-seeded each time,
    # because its days are relative to when it was seeded. This also drops real comments on demo posts.
    startCommand: flask init-db && flask clear-demo && flask seed-demo && gunicorn run:app
    envVars:
      # "Today" for check-ins and day counts. Render's clock is UTC, which rolls over mid-evening in North America.
      - key: TZ
        value: America/Toronto
      - key: DATABASE_URL
        fromDatabase:
          name: larphacks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Render asks for these when the Blueprint is first applied. The README explains how to get them.
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: larphacks-db
    plan: free
